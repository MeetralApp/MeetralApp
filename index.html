<!doctype html>
<html lang="en" class="dark" style="background-color:#0f1117;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/meetral-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1117" />
    <title>Meetral</title>
    <script>
      (function () {
        var KEY = "meetral-theme-preference";
        var pref = "dark";
        try {
          var stored = localStorage.getItem(KEY);
          if (stored === "dark" || stored === "light" || stored === "system") pref = stored;
        } catch (e) {}
        var dark = pref === "dark";
        if (pref === "light") dark = false;
        if (pref === "system") {
          dark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        var bg = dark ? "#0f1117" : "#f4f6f8";
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.backgroundColor = bg;
        root.style.colorScheme = dark ? "dark" : "light";
        if (dark) {
          root.style.setProperty("--boot-bg", "#0f1117");
          root.style.setProperty("--boot-border", "#2a2f3a");
          root.style.setProperty("--boot-card", "#14171d");
          root.style.setProperty("--boot-skeleton", "#252b36");
          root.style.setProperty("--boot-skeleton-highlight", "#3a424f");
          root.style.setProperty("--boot-shimmer", "#1a1f28");
        } else {
          root.style.setProperty("--boot-bg", "#f4f6f8");
          root.style.setProperty("--boot-border", "#d5dbe3");
          root.style.setProperty("--boot-card", "#ffffff");
          root.style.setProperty("--boot-skeleton", "#dde3ea");
          root.style.setProperty("--boot-skeleton-highlight", "#c5ced8");
          root.style.setProperty("--boot-shimmer", "#e8ecf0");
        }
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute("content", dark ? "dark" : "light");
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", bg);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--boot-bg, #0f1117);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      @keyframes boot-skeleton-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .boot-skeleton {
        box-sizing: border-box;
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 12px;
        background: var(--boot-bg, #0f1117);
      }

      .boot-skeleton__header {
        display: grid;
        flex-shrink: 0;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        padding-bottom: 12px;
      }

      .boot-skeleton__pill,
      .boot-skeleton__icon,
      .boot-skeleton__toolbar,
      .boot-skeleton__body {
        background-color: var(--boot-skeleton, #252b36);
        background-image: linear-gradient(
          90deg,
          var(--boot-shimmer, #1a1f28) 25%,
          var(--boot-skeleton-highlight, #3a424f) 50%,
          var(--boot-shimmer, #1a1f28) 75%
        );
        background-size: 200% 100%;
        animation: boot-skeleton-shimmer 1.2s ease-in-out infinite;
      }

      .boot-skeleton__pill {
        height: 36px;
        width: 176px;
        border-radius: 999px;
        justify-self: center;
      }

      .boot-skeleton__icon {
        height: 36px;
        width: 36px;
        border-radius: 8px;
        justify-self: end;
      }

      .boot-skeleton__grid {
        display: grid;
        min-height: 0;
        flex: 1;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .boot-skeleton__column {
        display: flex;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--boot-border, #2a2f3a);
        border-radius: 10px;
        background: var(--boot-card, #14171d);
      }

      .boot-skeleton__toolbar {
        height: 40px;
        flex-shrink: 0;
        border-radius: 0;
      }

      .boot-skeleton__body {
        min-height: 120px;
        flex: 1;
        border-radius: 0;
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="root">
      <div class="boot-skeleton" aria-busy="true" aria-label="Loading application">
        <header class="boot-skeleton__header">
          <div aria-hidden="true"></div>
          <div class="boot-skeleton__pill"></div>
          <div class="boot-skeleton__icon"></div>
        </header>
        <div class="boot-skeleton__grid">
          <div class="boot-skeleton__column">
            <div class="boot-skeleton__toolbar"></div>
            <div class="boot-skeleton__body"></div>
          </div>
          <div class="boot-skeleton__column">
            <div class="boot-skeleton__toolbar"></div>
            <div class="boot-skeleton__body"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
